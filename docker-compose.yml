services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: triage
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://triage:triage@db:5432/triage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  db_data:
